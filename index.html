<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны - Космос</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                0 0 60px rgba(59, 130, 246, 0.3),
                0 0 100px rgba(147, 51, 234, 0.2),
                inset 0 0 50px rgba(59, 130, 246, 0.1);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(10px);
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 40px;
            filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.6));
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid rgba(59, 130, 246, 0.5);
            box-shadow: 
                0 0 30px rgba(59, 130, 246, 0.4),
                0 0 60px rgba(147, 51, 234, 0.3),
                inset 0 0 30px rgba(59, 130, 246, 0.2);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            animation: wheelGlow 3s ease-in-out infinite;
        }

        @keyframes wheelGlow {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(59, 130, 246, 0.4),
                    0 0 60px rgba(147, 51, 234, 0.3),
                    inset 0 0 30px rgba(59, 130, 246, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 40px rgba(59, 130, 246, 0.6),
                    0 0 80px rgba(147, 51, 234, 0.5),
                    inset 0 0 40px rgba(59, 130, 246, 0.3);
            }
        }

        .arrow {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 45px solid #ec4899;
            filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8));
            z-index: 10;
            animation: arrowPulse 1.5s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 0 30px rgba(59, 130, 246, 0.8),
                inset 0 0 20px rgba(139, 92, 246, 0.5);
            z-index: 10;
            animation: centerPulse 2s ease-in-out infinite;
        }

        @keyframes centerPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 
                    0 0 30px rgba(59, 130, 246, 0.8),
                    inset 0 0 20px rgba(139, 92, 246, 0.5);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 
                    0 0 40px rgba(59, 130, 246, 1),
                    inset 0 0 30px rgba(139, 92, 246, 0.7);
            }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 15px;
            font-size: 16px;
            background: rgba(15, 23, 42, 0.5);
            color: #e2e8f0;
            transition: all 0.3s;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-add {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            position: relative;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
        }

        .btn-spin {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 20px;
            padding: 20px 50px;
            width: 100%;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            position: relative;
        }

        .btn-spin:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.8);
        }

        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .items-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .item-tag {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.3));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #e2e8f0;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-tag button {
            background: rgba(236, 72, 153, 0.5);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .item-tag button:hover {
            background: rgba(236, 72, 153, 0.8);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            transform: scale(1.1);
        }

        .modal-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 30px;
            padding: 40px 60px;
            box-shadow: 
                0 0 60px rgba(59, 130, 246, 0.6),
                0 0 100px rgba(147, 51, 234, 0.4),
                inset 0 0 50px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px);
            z-index: 1000;
            text-align: center;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .result-modal.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .result-modal h2 {
            font-size: 2em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        .result-modal p {
            font-size: 1.8em;
            color: #e2e8f0;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.8);
            margin-bottom: 30px;
        }

        .result-modal button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            transition: all 0.3s;
        }

        .result-modal button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.8);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .result-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 30px;
            padding: 40px 60px;
            box-shadow: 
                0 0 60px rgba(59, 130, 246, 0.6),
                0 0 100px rgba(147, 51, 234, 0.4),
                inset 0 0 50px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px);
            z-index: 1000;
            text-align: center;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .result-modal.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .result-modal h2 {
            font-size: 2em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        .result-modal p {
            font-size: 1.8em;
            color: #e2e8f0;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.8);
            margin-bottom: 30px;
        }

        .result-modal button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            transition: all 0.3s;
        }

        .result-modal button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.8);
        }

        @keyframes resultPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        @media (max-width: 768px) {
            .wheel-container {
                width: 280px;
                height: 280px;
            }
            
            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 20px;
                margin: 10px auto;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .btn-spin {
                padding: 15px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="result-modal" id="resultModal">
        <h2>🎉 Результат 🎉</h2>
        <p id="modalResult"></p>
        <button onclick="closeModal()">Закрыть</button>
    </div>
    
    <div class="container">
        <h1>🚀 Космическое Колесо Фортуны 🌌</h1>
        
        <div class="wheel-container">
            <div class="arrow"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
            <div class="center-circle"></div>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="itemInput" placeholder="Введите вариант...">
                <button class="btn-add" onclick="addItem()">Добавить</button>
            </div>
            
            <button class="btn-spin" onclick="spin()" id="spinBtn">✨ КРУТИТЬ КОЛЕСО ✨</button>
            
            <div class="items-list" id="itemsList"></div>
        </div>
    </div>

    <script>
        // Проверка на мобильное устройство
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        if (!isMobile()) {
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px;">
                    <div style="background: rgba(15, 23, 42, 0.9); padding: 40px; border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.5); box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);">
                        <h1 style="color: #60a5fa; font-size: 2em; margin-bottom: 20px;">📱 Только для мобильных устройств</h1>
                        <p style="color: #e2e8f0; font-size: 1.2em;">Это колесо фортуны доступно только на мобильных устройствах.<br>Откройте эту страницу на телефоне или планшете!</p>
                    </div>
                </div>
            `;
            throw new Error('Desktop access blocked');
        }

        // Создаем звезды
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        let items = [];
        let spinning = false;
        let rotation = 0;

        const colors = [
            'rgba(59, 130, 246, 0.8)',   // blue
            'rgba(139, 92, 246, 0.8)',   // purple
            'rgba(236, 72, 153, 0.8)',   // pink
            'rgba(14, 165, 233, 0.8)',   // sky
            'rgba(168, 85, 247, 0.8)',   // violet
            'rgba(244, 114, 182, 0.8)',  // pink-400
            'rgba(59, 130, 246, 0.9)',   // blue-500
            'rgba(147, 51, 234, 0.8)',   // purple-600
            'rgba(236, 72, 153, 0.9)',   // pink-500
            'rgba(96, 165, 250, 0.8)',   // blue-400
            'rgba(167, 139, 250, 0.8)',  // violet-400
            'rgba(219, 39, 119, 0.8)'    // pink-600
        ];

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 15;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Если нет пунктов, показываем пустое колесо
            if (items.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                gradient.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
                gradient.addColorStop(1, 'rgba(10, 14, 39, 0.6)');
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Текст подсказки
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Добавьте варианты', centerX, centerY);
                return;
            }

            const anglePerItem = (2 * Math.PI) / items.length;

            items.forEach((item, index) => {
                const startAngle = index * anglePerItem;
                const endAngle = startAngle + anglePerItem;

                // Рисуем сектор
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                
                // Градиент для каждого сектора
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                gradient.addColorStop(0, colors[index % colors.length]);
                gradient.addColorStop(1, 'rgba(10, 14, 39, 0.6)');
                ctx.fillStyle = gradient;
                ctx.fill();

                // Обводка сектора
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Добавляем свечение по краям
                ctx.shadowColor = colors[index % colors.length];
                ctx.shadowBlur = 10;

                // Текст
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerItem / 2);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 5;
                ctx.fillText(item, radius * 0.65, 5);
                ctx.restore();
            });
        }

        function updateItemsList() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            items.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = 'item-tag';
                tag.innerHTML = `
                    <span>${item}</span>
                    <button onclick="removeItem(${index})">×</button>
                `;
                list.appendChild(tag);
            });
            drawWheel();
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const value = input.value.trim();
            
            if (value && items.length < 12) {
                items.push(value);
                input.value = '';
                updateItemsList();
            } else if (items.length >= 12) {
                alert('Максимум 12 вариантов!');
            }
        }

        function removeItem(index) {
            items.splice(index, 1);
            updateItemsList();
        }

        function spin() {
            if (spinning || items.length < 2) {
                if (items.length < 2) {
                    alert('Добавьте минимум 2 варианта!');
                }
                return;
            }
            
            spinning = true;
            document.getElementById('spinBtn').disabled = true;

            const canvas = document.getElementById('wheel');
            const spins = 5 + Math.random() * 5;
            const extraDegrees = Math.random() * 360;
            const totalRotation = rotation + spins * 360 + extraDegrees;

            canvas.style.transform = `rotate(${totalRotation}deg)`;
            rotation = totalRotation % 360;

            setTimeout(() => {
                const anglePerItem = 360 / items.length;
                const normalizedRotation = (360 - (rotation % 360)) % 360;
                const winningIndex = Math.floor(normalizedRotation / anglePerItem) % items.length;
                
                showResultModal(items[winningIndex]);
                spinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 4000);
        }

        function showResultModal(result) {
            document.getElementById('modalResult').textContent = result;
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('resultModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('resultModal').classList.remove('show');
        }

        document.getElementById('itemInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });

        updateItemsList();
    </script>
</body>
</html>
